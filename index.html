  <script>
    (function () {
      var root = document.documentElement, btn = document.querySelector(".theme-toggle");
      function isDark() { return root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
      function sync() { var d = isDark(); root.dataset.theme = d ? "dark" : "light"; btn.setAttribute("aria-pressed", d); }
      sync();
      btn.addEventListener("click", function () {
        root.dataset.theme = isDark() ? "light" : "dark";
        try { localStorage.setItem("caracara-theme", root.dataset.theme); } catch (e) {}
        sync();
      });
      document.getElementById("y").textContent = new Date().getFullYear();
    })();
  </script>
